name: MaxFlix — testes e build

on:
  push:
    branches: [main, "feature/zero-active-renewal-manual-fallback"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maxflix-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Testes seguros e compilação
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependências do lockfile
        run: bun install --frozen-lockfile

      - name: Validar vencimentos, auditoria e Painel Recarga
        run: bun test src/lib/iptv.test.ts src/lib/server-panel-audit.test.ts src/lib/painel-recarga.test.ts

      - name: Preparar Deno para validação real das Edge Functions
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verificar tipos da Edge Function (sem deploy ou execução)
        run: deno check supabase/functions/painel-recarga-renovar/index.ts

      - name: Compilar a aplicação (sem deploy)
        run: bun run build
